<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#C4511A">
<meta name="app-versao" content="2026-10-05-segmentos">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feira Bêrga · Inscrições</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎪</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ground:#FFF4EA;--card:#FFFBF6;--ink:#2B1A0E;--ink-2:#6E5444;--line:#F1D9C4;--verde:#C4511A;--verde-soft:#FDE3CF;--on-verde:#FFFBF6;--laranja:#F39A3D;--laranja-soft:#FFEBD6;--on-laranja:#2B1405;--menta:#5E6E32;--menta-soft:#ECEFD9;--tomate:#A3261B;--tomate-soft:#F9DCD6;
--display:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#1C120B;--card:#28190F;--ink:#FBEDE0;--ink-2:#C9AE99;--line:#43301F;--verde:#F28B45;--verde-soft:#3E2414;--on-verde:#1C120B;--laranja:#F7B072;--laranja-soft:#3A2616;--on-laranja:#1E0E03;--menta:#B5C487;--menta-soft:#2A2E1A;--tomate:#F08A6F;--tomate-soft:#43221A}}
:root[data-theme="dark"]{--ground:#1C120B;--card:#28190F;--ink:#FBEDE0;--ink-2:#C9AE99;--line:#43301F;--verde:#F28B45;--verde-soft:#3E2414;--on-verde:#1C120B;--laranja:#F7B072;--laranja-soft:#3A2616;--on-laranja:#1E0E03;--menta:#B5C487;--menta-soft:#2A2E1A;--tomate:#F08A6F;--tomate-soft:#43221A}
html{height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--verde);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 110px}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-.02em;margin:6px 0 4px}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:22px 0 10px}
.sub{color:var(--ink-2);margin:0 0 14px;font-size:14px}
.painel{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(120,60,20,.06),0 6px 18px rgba(196,81,26,.06);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.kv:first-child{border-top:0}.kv span{color:var(--ink-2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-radius:14px;border:0;font-weight:600}
.btn.pri{background:var(--verde);color:var(--on-verde)}.btn.sec{background:var(--card);border:1px solid var(--line)}.btn.amarelo{background:var(--laranja);color:var(--on-laranja)}
.btn:disabled{opacity:.5;cursor:default}
.mini{min-height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;padding:0 12px}
.mini.pri{background:var(--verde);border-color:var(--verde);color:var(--on-verde)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;font:inherit}
textarea{min-height:80px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.g2>*{min-width:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:26px}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
.erro{color:var(--tomate);font-size:13px;margin:6px 0 0;min-height:1em}
.toldo{position:relative;height:120px;overflow:hidden;border-radius:20px 20px 0 0}
.toldo .l{position:absolute;inset:0 0 13px 0;background:repeating-linear-gradient(90deg,#C4511A 0 26px,#F6B57A 26px 52px)}
.toldo .f{position:absolute;left:0;right:0;top:calc(100% - 26px);height:26px;background:radial-gradient(circle at 13px 0,#C4511A 12.5px,transparent 13px) 0 0/52px 26px repeat-x,radial-gradient(circle at 39px 0,#F6B57A 12.5px,transparent 13px) 0 0/52px 26px repeat-x}
.data{position:absolute;top:12px;left:12px;background:var(--card);border-radius:14px;padding:6px 12px;text-align:center;min-width:56px}
.data b{display:block;font-family:var(--display);font-size:26px;line-height:1}.data span{font-size:12px;color:var(--ink-2);font-weight:600}
.selo{position:absolute;top:14px;right:12px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--card);color:var(--menta)}
.cardfeira{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:14px}
.cardfeira .c{padding:12px 16px 16px}
.status{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--verde-soft);color:var(--verde)}
.status.ok{background:var(--menta-soft);color:var(--menta)}.status.n{background:var(--line);color:var(--ink-2)}.status.t{background:var(--tomate-soft);color:var(--tomate)}
.opcoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:12px;text-align:left;min-height:68px}
.op b{font-family:var(--display);font-size:22px;display:block}.op small{color:var(--ink-2)}
.op[aria-pressed="true"]{border-color:var(--verde);background:var(--verde-soft)}
.passos{list-style:none;margin:8px 0 0;padding:0}.passos li{display:flex;gap:12px;padding:8px 0}
.bola{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--verde-soft);color:var(--verde)}
.feito .bola{background:var(--verde);color:var(--on-verde)}.agora .bola{background:var(--laranja);color:var(--on-laranja)}
.passos small{display:block;color:var(--ink-2)}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fotos .ft{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--verde-soft);position:relative}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
.fotos .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:var(--card)}
.mapawrap{position:relative;border-radius:14px;overflow:hidden;background:var(--verde-soft);touch-action:manipulation}
.mapawrap img{width:100%;display:block;user-select:none;-webkit-user-drag:none}
.vg{position:absolute;border:2px solid var(--verde);background:rgba(255,251,246,.92);color:#5A250B;border-radius:6px;font-size:11px;font-weight:700;padding:0;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%)}
.vg.oc{background:rgba(110,84,68,.75);border-color:transparent;color:#fff}
.vg.out{border-style:dashed;opacity:.5}
.vg.minha{background:#5E6E32;border-color:#3B4420;color:#FFFBF6}
.vg.sel{outline:3px solid var(--tomate)}
.expo{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.cartao{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.cartao .foto{height:110px;background:var(--verde-soft);position:relative}
.cartao .foto img{width:100%;height:100%;object-fit:cover}
.cartao .ord{position:absolute;top:6px;left:6px;background:var(--card);border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px}
.cartao .av{position:absolute;bottom:6px;left:6px;right:6px;background:var(--card);border-radius:8px;font-size:11px;font-weight:600;color:var(--tomate);text-align:center}
.cartao .i{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cartao small{color:var(--ink-2);font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1}
.cota{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.cota:first-child{border-top:0}
.barra{height:6px;border-radius:999px;background:var(--verde-soft);overflow:hidden;margin-top:4px}.barra i{display:block;height:100%;background:var(--verde)}
.tabwrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--ink-2);padding:6px 8px 6px 0}td{padding:8px 8px 8px 0;border-top:1px solid var(--line)}
nav.baixo{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:3}
nav.baixo .in{display:flex;width:100%;max-width:720px}
nav.baixo{box-shadow:0 -6px 20px rgba(120,60,20,.08)}
nav.baixo button{flex:1;border:0;background:transparent;font-size:11px;font-weight:600;color:var(--ink-2);min-height:56px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 0}
nav.baixo button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.baixo button[aria-current="page"]{color:var(--verde);background:var(--verde-soft)}
.topo{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--ground);border-radius:14px;padding:12px 16px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.check{display:flex;align-items:center;gap:10px;font-weight:500}.check input{width:20px;min-height:20px}

.cabeca{margin:-16px -16px 18px;padding:16px 18px 30px;background:linear-gradient(120deg,#B8471A,#E06A26);color:#FFFBF6;position:relative}
.cabeca::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:24px;background:radial-gradient(circle at 13px 0,#C9561F 12px,transparent 12.5px) 0 0/26px 24px repeat-x}
.cabeca .linha1{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px}
.cabeca .papel{margin-left:auto;font-family:var(--body);font-size:12px;font-weight:600;background:rgba(255,251,246,.18);padding:4px 10px;border-radius:999px}
.berg{display:inline-block;flex:none}
.hero{position:relative;padding:22px 18px 18px;background:linear-gradient(135deg,#B8471A 0%,#E06A26 100%);color:#FFFBF6;border-radius:22px;overflow:hidden;margin-top:12px}
.hero h1{color:#FFFBF6;margin:10px 0 4px}.hero p{margin:0;opacity:.85}
.hero .b1{position:absolute;right:-14px;top:-10px;opacity:.95}.hero .b2{position:absolute;right:58px;top:40px;opacity:.9}
.vazio{text-align:center;padding:26px 10px}.vazio .berg{margin-bottom:8px}
.resumo{display:flex;gap:12px;align-items:center}.resumo img{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none;background:var(--verde-soft)}
.senha{position:relative}.senha input{padding-right:52px}
.olho{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:40px;border:0;background:transparent;color:var(--ink-2);display:flex;align-items:center;justify-content:center;border-radius:10px}
.olho svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="tela"><p class="sub">Carregando…</p></div>
<nav class="baixo" id="nav" hidden><div class="in" id="navin"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const SUPABASE_URL='https://dpjqqbtexbdmjqeecssq.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwanFxYnRleGJkbWpxZWVjc3NxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMDE2ODAsImV4cCI6MjEwNjc3NzY4MH0.AwUT8KNwL2tzE39wzHTQxq73kt2Sh1noNA6hOeIBEM4';
const lembrar=()=>{try{return localStorage.getItem('berga-lembrar')!=='0'}catch{return true}};
const guarda={
  getItem:k=>{try{return localStorage.getItem(k)??sessionStorage.getItem(k)}catch{return null}},
  setItem:(k,v)=>{try{if(lembrar()){localStorage.setItem(k,v);sessionStorage.removeItem(k)}else{sessionStorage.setItem(k,v);localStorage.removeItem(k)}}catch{}},
  removeItem:k=>{try{localStorage.removeItem(k);sessionStorage.removeItem(k)}catch{}}
};
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storage:guarda,persistSession:true}});
const emailSalvo=()=>{try{return localStorage.getItem('berga-email')||''}catch{return ''}};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>v==null?'a definir':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const dataBR=d=>{if(!d)return'';const[a,m,dd]=d.split('-');return `${dd}/${m}/${a}`};
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2800)}
function erroMsg(e){const m=(e&&e.message)||String(e);if(/Invalid login/i.test(m))return'E-mail ou senha incorretos.';if(/already registered/i.test(m))return'Esse e-mail já tem conta. Use "Entrar".';if(/Password should/i.test(m))return'A senha precisa ter pelo menos 6 caracteres.';return m}


function berg(t=28){return `<svg class="berg" width="${t}" height="${t}" viewBox="0 0 40 40" aria-hidden="true"><path d="M21 9c3-5 9-6 12-4-2 4-7 6-12 4z" fill="#5E6E32"/><path d="M20 10c0-2 0-3-1-5" stroke="#3B4420" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="20" cy="23" r="13" fill="#F28A35"/><path d="M12 20c2-4 6-6 10-5" stroke="#F6B27A" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".8"/><circle cx="20" cy="11.5" r="1.6" fill="#B85A18"/><g fill="#C9601F" opacity=".5"><circle cx="15" cy="27" r=".9"/><circle cx="24" cy="29" r=".9"/><circle cx="27" cy="22" r=".9"/><circle cx="19" cy="31" r=".9"/></g></svg>`}
const topo=()=>`<div class="cabeca"><div class="linha1">${berg(34)}Feira Bêrga<button class="papel" data-go="conta" style="border:0;color:inherit">${S.papel==='organizadora'?'Organização':'Expositor'} · Conta</button></div></div>`;
const S={sessao:null,papel:'expositor',marca:null,segs:[],tela:'inicio',edicao:null,orgEdicao:null,canal:null,mapaSel:null,vagaSel:null};

async function iniciar(){
  const {data}=await sb.auth.getSession();S.sessao=data.session;
  sb.auth.onAuthStateChange((ev,s)=>{const antes=!!S.sessao;S.sessao=s;if(ev==='PASSWORD_RECOVERY'){S.tela='novasenha';render();return}if(!!s!==antes)carregarUsuario()});
  const r=await sb.from('segmentos').select('*').order('ordem');S.segs=r.data||[];
  await carregarUsuario();
}
async function carregarUsuario(){
  if(!S.sessao){S.papel='expositor';S.marca=null;S.tela=location.hash==='#proposta'?'proposta':'auth';return render()}
  const uid=S.sessao.user.id;
  const [p,m]=await Promise.all([sb.from('perfis').select('papel').eq('id',uid).maybeSingle(),sb.from('marcas').select('*').eq('dono',uid).maybeSingle()]);
  S.papel=p.data?.papel||'expositor';S.marca=m.data;
  S.tela=S.papel==='organizadora'?'org-edicoes':'inicio';render();
}
const segNome=s=>S.segs.find(x=>x.slug===s)?.nome||s;

const NI={inicio:'<path d="M4 8h16v12H4z"/><path d="M4 8l2-4h12l2 4M9 20v-6h6v6"/>',marca:'<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',conta:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>','org-edicoes':'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>','org-selecao':'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 11l2 2 4-4"/>','org-mapas':'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>','org-lista':'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>','org-feedback':'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>','org-propostas':'<path d="M4 21V5l8-2v18M12 8h8v13M4 21h16"/>'};
function nav(){
  const n=$('#nav');if(!S.sessao){n.hidden=true;return}n.hidden=false;
  const itens=S.papel==='organizadora'?[['org-edicoes','Edições'],['org-selecao','Seleção'],['org-mapas','Mapas'],['org-lista','Lista'],['org-feedback','Feedback'],['org-propostas','Espaços']]:[['inicio','Feira'],['marca','Minha marca'],['conta','Conta']];
  $('#navin').innerHTML=itens.map(([t,l])=>`<button data-go="${t}" ${S.tela===t||(t==='inicio'&&['edicao','mapa','montagem','feedback'].includes(S.tela))?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${NI[t]||''}</svg>${l}</button>`).join('');
}
async function render(){
  nav();const T=TELAS[S.tela]||TELAS.inicio;
  try{const h=await T();$('#tela').innerHTML=(S.sessao&&!['auth','novasenha'].includes(S.tela)?topo():'')+h}catch(e){$('#tela').innerHTML=`<h1>Ops</h1><p class="sub">${esc(erroMsg(e))}</p><button class="btn sec" data-go="inicio">Voltar</button>`}
  window.scrollTo(0,0);if(AFTER[S.tela])AFTER[S.tela]();
}
function go(t){if(S.canal){sb.removeChannel(S.canal);S.canal=null}S.tela=t;render()}

/* ================= AUTENTICAÇÃO ================= */
let modoAuth='entrar';
const TELAS={};const AFTER={};
TELAS.auth=()=>`<div class="hero"><span class="b1">${berg(96)}</span><span class="b2">${berg(44)}</span><p style="font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px">Inscrições</p><h1>Feira<br>Bêrga</h1><p>${modoAuth==='entrar'?'Entre pra se inscrever nas edições.':'Crie sua conta. Leva um minuto.'}</p></div><div class="painel" style="margin-top:12px">
<label for="a-email">E-mail</label><input id="a-email" type="email" autocomplete="email" value="${esc(emailSalvo())}">
<label for="a-senha">Senha</label><div class="senha"><input id="a-senha" type="password" autocomplete="${modoAuth==='entrar'?'current-password':'new-password'}"><button type="button" class="olho" data-olho="a-senha" aria-label="Mostrar senha" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
${modoAuth==='criar'?'<p class="sub" style="margin:4px 0 0;font-size:12px">Mínimo de 6 caracteres.</p>':''}
<label class="check" style="margin-top:12px"><input type="checkbox" id="a-lembrar" ${lembrar()?'checked':''}> Lembrar usuário</label>
<p class="erro" id="a-err"></p>
<button class="btn pri" id="a-ok">${modoAuth==='entrar'?'Entrar':'Criar conta'}</button>
<button class="btn sec" id="a-troca" style="margin-top:8px">${modoAuth==='entrar'?'Ainda não tenho conta':'Já tenho conta'}</button>
${modoAuth==='entrar'?'<button class="mini" id="a-esqueci" style="margin-top:12px;border:0;background:none;color:var(--ink-2)">Esqueci minha senha</button>':''}
</div>

const fimEd=e=>e.data_fim||e.data;
const hfmt=t=>{if(!t)return'';const[h,m]=t.split(':');return `${+h}h${m!=='00'?m:''}`};
const hparse=txt=>{const r=[];String(txt||'').replace(/(\d{1,2})h(\d{2})?/g,(_,h,m)=>{r.push(`${String(h).padStart(2,'0')}:${m||'00'}`)});return r};
const faixa=(a,b)=>a&&b?`${hfmt(a)} às ${hfmt(b)}`:a?`a partir das ${hfmt(a)}`:'';
const moedaTxt=v=>v==null||v===''?'':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const moedaNum=t=>{const d=String(t||'').replace(/\D/g,'');return d?Number(d)/100:null};
const diaCurto=d=>{if(!d)return'';const[a,m,dd]=d.split('-');return `${dd}/${m}`};
const periodo=e=>e.data_fim&&e.data_fim!==e.data?`${dataBR(e.data).slice(0,5)} a ${dataBR(e.data_fim)}`:dataBR(e.data);
async function listarProximas(){
  const hoje=new Date().toISOString().slice(0,10);
  const {data,error}=await sb.from('edicoes').select('*').or(`data.gte.${hoje},data_fim.gte.${hoje}`).order('data');if(error)throw error;
  return data||[];
}
function toldo(e,status){const[,m,d]=e.data.split('-');const df=e.data_fim&&e.data_fim!==e.data?e.data_fim.split('-')[2]:null;return `<div class="toldo"><div class="l"></div><div class="f"></div><div class="data"><b>${df?(+d)+'–'+(+df):d}</b><span>${MES[+m-1]}</span></div>${status?`<span class="selo">${status}</span>`:''}</div>`}

async function inicioBase(){
  const e=S.edicao;
  const {data:ins}=await sb.from('inscricoes').select('*').eq('edicao_id',e.id).eq('marca_id',S.marca.id).maybeSingle();
  S.ins=ins;
  if(!ins&&!S.tamEscolhido){const {data:ult}=await sb.from('inscricoes').select('tamanho').eq('dono',S.sessao.user.id).order('criado_em',{ascending:false}).limit(1);S.tamEscolhido=ult?.[0]?.tamanho;S.jaParticipou=!!ult?.length}
  let tam=ins?.tamanho||S.tamEscolhido||'2m';S.tamEscolhido=tam;
  const mk=S.marca;const resumo=`<div class="painel"><div class="resumo">${mk.fotos?.[0]?`<img src="${esc(mk.fotos[0])}" alt="">`:''}<div style="flex:1"><b>${esc(mk.nome)}</b><div class="sub" style="margin:0">${esc(segNome(mk.segmento))}${mk.instagram?' · '+esc(mk.instagram):''}</div></div><button class="mini" data-go="marca">Revisar</button></div><p class="sub" style="margin:10px 0 0;font-size:13px">${S.jaParticipou?'Seus dados da última participação já estão aqui. Confira se mudou algo antes de se inscrever.':'Esses dados vão junto com a sua inscrição.'}</p></div>`;
  const info=`<div class="painel"><div class="kv"><span>Local</span><b>${esc(e.local||'a definir')}</b></div><div class="kv"><span>Montagem</span><b>${e.data_montagem?diaCurto(e.data_montagem)+(e.horario_montagem?', ':''):''}${esc(e.horario_montagem||(e.data_montagem?'':'a definir'))}</b></div><div class="kv"><span>Feira aberta</span><b>${esc(e.horario_feira||'a definir')}</b></div><div class="kv"><span>Desmontagem</span><b>${esc(e.horario_desmontagem||'a definir')}</b></div>${e.valor_estacionamento!=null?`<div class="kv"><span>Estacionamento</span><b>${money(e.valor_estacionamento)}, com placa</b></div>`:''}</div>`;
  const cab=`<button class="mini" data-go="inicio" style="border:0;background:none">← Edições</button><div class="cardfeira" style="margin-top:6px">${toldo(e,e.inscricoes_abertas?'Inscrições abertas':ins?null:'Inscrições em breve')}<div class="c"><p style="font-family:var(--display);font-size:24px;font-weight:700;margin:0">${esc(e.titulo)}</p><p class="sub" style="margin:0">${periodo(e)}</p></div></div>`;
  let segFora=false;
  if(!ins){const {data:cz}=await sb.from('edicao_cotas').select('limite').eq('edicao_id',e.id).eq('segmento',S.marca.segmento).maybeSingle();segFora=cz?.limite===0}
  if(!ins&&segFora)return cab+`<div class="painel"><span class="status n">Fora dessa edição</span><p style="margin:10px 0 0">Essa edição não vai receber expositores de ${esc(segNome(S.marca.segmento))}. Fica de olho nas próximas!</p></div>`+info;
  if(!ins){
    if(!e.inscricoes_abertas)return cab+info+`<p class="sub">As inscrições ainda não abriram. Você recebe aviso pelo grupo quando abrirem.</p>`;
    return cab+resumo+`<h2>Tamanho do espaço</h2>${S.jaParticipou?'<p class="sub" style="margin-top:-6px">Deixamos marcado o tamanho que você usou da última vez.</p>':''}<div class="opcoes">${['2m','3m'].map(t=>`<button class="op" data-tam="${t}" aria-pressed="${tam===t}"><b>${t.replace('m',' m')}</b><small>${money(t==='2m'?e.preco_2m:e.preco_3m)}</small></button>`).join('')}</div>${S.pend?`<button class="btn sec" data-go="feedback" style="margin-top:16px">Responda o feedback da edição anterior pra liberar</button>`:`<button class="btn pri" id="inscrever" style="margin-top:16px">Quero participar</button>`}<h2>Informações da edição</h2>`+info;
  }
  if(ins.status==='encerrada')return cab+`<div class="painel"><span class="status n">Vagas preenchidas</span><p style="margin:10px 0 0">As vagas dessa edição foram preenchidas. Seu perfil continua salvo, e você recebe convite se abrir uma vaga ou quando a próxima edição abrir.</p></div>`;
  const {data:mont}=await sb.from('montagem').select('inscricao_id').eq('inscricao_id',ins.id).maybeSingle();
  const conf=ins.status==='confirmada';
  const passos=[['Inscrição recebida',`${ins.tamanho.replace('m',' m')} · a organização confirma as presenças quando as inscrições fecharem`,true],['Presença confirmada',conf?'Você está na feira!':'Aguardando a organização',conf],['Pagamento do espaço',ins.pago?'Pagamento confirmado':ins.comprovante_path?'Comprovante enviado, aguardando a organização conferir':'Pague e envie o comprovante aqui no app',ins.pago],['Escolher sua vaga no mapa',ins.vaga_id?'Vaga escolhida':'Libera depois do pagamento',!!ins.vaga_id],['Dados da montagem',mont?'Enviados':'Mesas, cadeiras, placa e quem vai montar',!!mont]];
  const ag=passos.findIndex(p=>!p[2]);
  let acao='';
  if(conf&&!ins.pago){const valor=ins.tamanho==='2m'?e.preco_2m:e.preco_3m;
    acao+=`<div class="painel" style="background:var(--laranja-soft);border-color:transparent"><b>Pagamento do espaço ${ins.tamanho.replace('m',' m')}${valor!=null?': '+money(valor):''}</b>
    ${e.chave_pix?`<div class="kv" style="border:0;margin-top:6px;align-items:center"><span>Chave Pix</span><b style="word-break:break-all;text-align:right">${esc(e.chave_pix)}</b></div><button class="mini" id="copiar-pix" style="width:100%;margin-top:4px">Copiar chave Pix</button>`:''}
    ${e.link_pagamento?`<a class="btn sec" href="${esc(e.link_pagamento)}" target="_blank" rel="noopener" style="text-decoration:none;margin-top:8px">Pagar pelo link</a>`:''}
    ${!e.chave_pix&&!e.link_pagamento?'<p class="sub" style="margin:6px 0 0">A organização vai passar os dados de pagamento.</p>':''}
    <p class="sub" style="margin:12px 0 6px">${ins.comprovante_path?'Comprovante enviado. Assim que a organização conferir, o mapa de vagas libera.':'Depois de pagar, envie o comprovante (foto, print ou PDF).'}</p>
    <label class="btn ${ins.comprovante_path?'sec':'pri'}" for="comp-file" style="font-weight:600">${ins.comprovante_path?'Enviar outro comprovante':'Enviar comprovante'}</label><input id="comp-file" type="file" accept="image/*,application/pdf" hidden></div>`}
  if(conf&&ins.pago&&e.mapa_id)acao+=`<button class="btn ${ins.vaga_id?'sec':'pri'}" data-go="mapa" style="margin-bottom:8px">${ins.vaga_id?'Ver minha vaga no mapa':'Escolher minha vaga'}</button>`;
  if(conf)acao+=`<button class="btn ${mont?'sec':'amarelo'}" data-go="montagem">${mont?'Revisar dados da montagem':'Preencher dados da montagem'}</button>`;
  return cab+`<div class="painel"><span class="status ${conf?'ok':''}">${conf?'Presença confirmada':'Inscrição recebida'}</span><ol class="passos">${passos.map((p,i)=>`<li class="${p[2]?'feito':i===ag?'agora':''}"><span class="bola">${p[2]?'✓':i+1}</span><div><b>${p[0]}</b><small>${p[1]}</small></div></li>`).join('')}</ol></div>${acao}<h2>Informações da edição</h2>${info}${e.regras?`<div class="painel"><b>Regras do local</b><p style="margin:6px 0 0;white-space:pre-line">${esc(e.regras)}</p></div>`:''}${e.link_fotos?`<a class="btn sec" href="${esc(e.link_fotos)}" target="_blank" rel="noopener" style="text-decoration:none">Ver fotos da feira</a>`:''}`;
};

const cardPend=()=>S.pend?`<div class="painel" style="background:var(--laranja-soft);border-color:var(--laranja);color:var(--ink)"><b>Como foi a ${esc(S.pend.titulo)} de ${dataBR(S.pend.data)}?</b><p style="margin:4px 0 10px">Conta pra gente em menos de um minuto. Novas inscrições liberam depois do seu feedback.</p><button class="btn pri" data-go="feedback">Responder agora</button></div>`:'';
async function carregaPend(){S.pend=null;if(S.marca){const r=await sb.rpc('feedback_pendente');S.pend=(r.data||[])[0]||null}}
TELAS.inicio=async()=>{
  if(!S.marca)return `<div class="vazio" style="padding-bottom:6px">${berg(64)}</div><h1>Boas-vindas!</h1><p class="sub">Antes de se inscrever, cadastre sua marca. Fica salvo pras próximas edições.</p><button class="btn pri" data-go="marca">Cadastrar minha marca</button>`;
  await carregaPend();
  const eds=await listarProximas();S.listaEds=eds;
  if(!eds.length)return cardPend()+`<div class="vazio">${berg(64)}<h1>${esc(S.marca.nome)}</h1><p class="sub">Ainda não tem edição marcada. Assim que a próxima abrir, ela aparece aqui.</p></div>`;
  const {data:minhas}=await sb.from('inscricoes').select('edicao_id,status,pago').eq('marca_id',S.marca.id).in('edicao_id',eds.map(e=>e.id));
  const st=Object.fromEntries((minhas||[]).map(i=>[i.edicao_id,i]));
  const {data:zs}=await sb.from('edicao_cotas').select('edicao_id').eq('segmento',S.marca.segmento).eq('limite',0).in('edicao_id',eds.map(e=>e.id));const fora=new Set((zs||[]).map(z=>z.edicao_id));
  const selo=(e,i)=>!i&&fora.has(e.id)?['Fora dessa edição','n']:!i?(e.inscricoes_abertas?['Inscrições abertas','ok']:['Em breve','n']):i.status==='encerrada'?['Vagas preenchidas','n']:i.status==='confirmada'?(i.pago?['Presença confirmada','ok']:['Pagamento pendente','t']):['Inscrição recebida',''];
  return cardPend()+`<h1>Edições</h1><p class="sub">Toque numa edição pra se inscrever ou acompanhar.</p>`+eds.map(e=>{const [t,c]=selo(e,st[e.id]);return `<button class="cardfeira" data-ed="${e.id}" style="width:100%;text-align:left;padding:0;display:block">${toldo(e,null)}<div class="c"><div class="topo"><p style="font-family:var(--display);font-size:21px;font-weight:700;margin:0">${esc(e.titulo)}</p><span class="status ${c}">${t}</span></div><p class="sub" style="margin:2px 0 0">${periodo(e)}${e.local?' · '+esc(e.local):''}</p></div></button>`}).join('');
};
TELAS.edicao=async()=>{
  if(!S.edicao)return TELAS.inicio();
  const {data}=await sb.from('edicoes').select('*').eq('id',S.edicao.id).single();if(data)S.edicao=data;
  await carregaPend();
  return await inicioBase();
};

<label for="m-nome">Nome da marca</label><input id="m-nome" value="${esc(m.nome)}">
<label for="m-seg">Segmento</label><select id="m-seg">${S.segs.map(s=>`<option value="${s.slug}" ${m.segmento===s.slug?'selected':''}>${esc(s.nome)}</option>`).join('')}</select>
<div class="g2"><div><label for="m-insta">Instagram</label><input id="m-insta" value="${esc(m.instagram)}" placeholder="@suamarca"></div><div><label for="m-zap">WhatsApp</label><input id="m-zap" inputmode="tel" value="${esc(m.whatsapp)}"></div></div>
<label for="m-desc">Sobre a marca (opcional)</label><textarea id="m-desc">${esc(m.descricao)}</textarea>
<label>Fotos do trabalho (mínimo 3)</label><p class="sub" style="margin:0 0 8px;font-size:13px">Usadas na divulgação da feira.</p>
<div class="fotos" id="fotos"></div>
<label class="btn sec" for="m-file" style="margin-top:10px;font-weight:600">Adicionar fotos</label><input id="m-file" type="file" accept="image/*" multiple hidden>
<p class="erro" id="m-err"></p></div><button class="btn pri" id="m-ok">Salvar marca</button>`};
function desenhaFotos(){const el=$('#fotos');if(!el)return;el.innerHTML=S.fotos.map((u,i)=>`<div class="ft"><img src="${esc(u)}" alt="Foto ${i+1} do trabalho"><button class="x" data-rmfoto="${i}" aria-label="Remover foto ${i+1}">✕</button></div>`).join('')||'<p class="sub" style="grid-column:1/-1;margin:0">Nenhuma foto ainda.</p>'}
AFTER.marca=desenhaFotos;

TELAS.conta=()=>`<h1>Conta</h1><div class="painel"><div class="kv"><span>E-mail</span><b>${esc(S.sessao.user.email)}</b></div></div><button class="btn sec" id="sair">Sair</button>`;

TELAS.mapa=async()=>{
  const e=S.edicao,ins=S.ins;if(!e||!ins)return `<p class="sub">Volte pra tela da edição.</p><button class="btn sec" data-go="inicio">Edições</button>`;
  const [mp,vg,oc,bl]=await Promise.all([sb.from('mapas').select('*').eq('id',e.mapa_id).single(),sb.from('mapa_vagas').select('*').eq('mapa_id',e.mapa_id).order('numero'),sb.from('vagas_ocupadas').select('vaga_id').eq('edicao_id',e.id),sb.from('edicao_vagas_bloqueadas').select('vaga_id').eq('edicao_id',e.id)]);
  S.vagas=vg.data||[];S.ocup=new Set((oc.data||[]).map(x=>x.vaga_id));S.bloq=new Set((bl.data||[]).map(x=>x.vaga_id));S.mapaImg=mp.data?.imagem_url;
  const minha=S.vagas.find(v=>v.id===ins.vaga_id);
  return `<button class="mini" data-go="edicao" style="border:0;background:none">← Edição</button><h1>Escolha sua vaga</h1><p class="sub">Você contratou ${ins.tamanho.replace('m',' m')}. Vagas de outro tamanho ficam tracejadas.</p>
  ${e.prazo_escolha_vaga&&!minha?`<div class="painel" style="background:var(--laranja-soft);border-color:var(--laranja);color:var(--ink)">Escolha até ${new Date(e.prazo_escolha_vaga).toLocaleString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}. Depois disso, a organização define por você.</div>`:''}
  <div class="mapawrap" id="mapa"></div>
  <p class="sub" style="margin-top:10px">${minha?`Sua vaga: <b>${minha.numero}</b>. Dá pra trocar enquanto o prazo estiver aberto.`:'Toque numa vaga livre pra reservar.'}</p>`;
};
function desenhaMapaExpositor(){
  const w=$('#mapa');if(!w)return;const ins=S.ins;
  w.innerHTML=(S.mapaImg?`<img src="${esc(S.mapaImg)}" alt="Planta da feira">`:'<div style="padding:40px;text-align:center" class="sub">Mapa sem imagem</div>')+S.vagas.filter(v=>!S.bloq.has(v.id)).map(v=>{const minha=v.id===ins.vaga_id,oc=S.ocup.has(v.id)&&!minha,out=v.tamanho!==ins.tamanho;
  return `<button class="vg ${oc?'oc':out?'out':''} ${minha?'minha':''}" style="left:${v.x}%;top:${v.y}%;width:${v.largura}%;height:${v.altura}%" data-escolher="${v.id}" ${oc||out?'aria-disabled="true"':''} aria-label="Vaga ${v.numero}, ${v.tamanho}${oc?', ocupada':''}">${v.numero}</button>`}).join('');
}
AFTER.mapa=()=>{desenhaMapaExpositor();if(!S.edicao)return;
  S.canal=sb.channel('ocupadas-'+S.edicao.id).on('postgres_changes',{event:'*',schema:'public',table:'vagas_ocupadas',filter:'edicao_id=eq.'+S.edicao.id},async()=>{const {data}=await sb.from('vagas_ocupadas').select('vaga_id').eq('edicao_id',S.edicao.id);S.ocup=new Set((data||[]).map(x=>x.vaga_id));desenhaMapaExpositor()}).subscribe();};

TELAS.montagem=async()=>{
  const ins=S.ins,e=S.edicao;if(!ins)return `<button class="btn sec" data-go="inicio">Feira</button>`;
  const [mo,mt]=await Promise.all([sb.from('montagem').select('*').eq('inscricao_id',ins.id).maybeSingle(),sb.from('montadores').select('*').eq('inscricao_id',ins.id)]);
  let m=mo.data,pes=mt.data||[],veio=false;
  if(!m){const {data:ant}=await sb.from('inscricoes').select('id,criado_em,montagem(*),montadores(nome,cpf)').eq('dono',S.sessao.user.id).neq('id',ins.id).order('criado_em',{ascending:false}).limit(5);
    const a=(ant||[]).find(x=>Array.isArray(x.montagem)?x.montagem.length:x.montagem);
    if(a){const am=Array.isArray(a.montagem)?a.montagem[0]:a.montagem;m={mesas:am.mesas,cadeiras:am.cadeiras,usa_estacionamento:am.usa_estacionamento,placa:am.placa||''};pes=a.montadores||[];veio=true}}
  m=m||{mesas:0,cadeiras:0,usa_estacionamento:false,placa:''};
  S.montadores=(pes.length?pes:[{nome:'',cpf:''}]).map(x=>({nome:x.nome,cpf:x.cpf}));
  return `<button class="mini" data-go="edicao" style="border:0;background:none">← Edição</button><h1>Dados da montagem</h1><p class="sub">Vão pra lista que a organização envia ao local. Os CPFs são apagados depois da edição.</p>${veio?'<div class="painel" style="background:var(--verde-soft);border-color:transparent">Preenchemos com o que você mandou na última edição. Confira e ajuste o que mudou. Se os CPFs e a placa estiverem vazios, é porque foram apagados depois daquela feira.</div>':''}
  <div class="painel"><div class="g2"><div><label for="mo-mesa">Mesas</label><input id="mo-mesa" type="number" min="0" value="${m.mesas}"></div><div><label for="mo-cad">Cadeiras</label><input id="mo-cad" type="number" min="0" value="${m.cadeiras}"></div></div>
  ${e?.valor_estacionamento!=null?`<label class="check" style="margin-top:14px"><input type="checkbox" id="mo-est" ${m.usa_estacionamento?'checked':''}> Vou usar o estacionamento (${money(e.valor_estacionamento)})</label><div id="mo-placa-w" ${m.usa_estacionamento?'':'hidden'}><label for="mo-placa">Placa do carro</label><input id="mo-placa" value="${esc(m.placa)}" style="text-transform:uppercase"></div>`:''}</div>
  <div class="painel"><b>Quem vai montar</b><div id="mts"></div><button class="mini" id="mt-add" style="margin-top:10px">+ Adicionar pessoa</button></div>

  const {data:r,error}=await sb.rpc('resultados_feedback',{p_edicao:S.fbEd});if(error)throw error;
  const tot=r.respostas||0;
  const bloco=(chave,ops)=>{const d=chave==='primeira'?r.primeira:r[chave]||{};return `<div class="painel"><b>${ROT[chave]}</b>${ops.map(([v,l])=>{const n=d[String(v)]||0,pc=tot?Math.round(n/tot*100):0;return `<div style="margin-top:8px"><div class="topo" style="font-size:13px"><span>${l}</span><span style="color:var(--ink-2)">${n} · ${pc}%</span></div><div class="barra" style="height:8px"><i style="width:${pc}%"></i></div></div>`}).join('')}</div>`};
  return `<h1>Feedback</h1><select id="fb-ed" aria-label="Edição">${passadas.map(x=>`<option value="${x.id}" ${x.id===S.fbEd?'selected':''}>${esc(x.titulo)} · ${periodo(x)}</option>`).join('')}</select>
  <p class="sub" style="margin-top:8px">${tot} de ${r.confirmados} expositores responderam. Quem não responder não consegue se inscrever na próxima edição.</p>
  ${tot?bloco('primeira',[['sim','Sim'],['nao','Não']])+bloco('faturamento',FAT)+bloco('voltaria',SNT)+bloco('indicaria',SNT)+['organizacao','divulgacao','publico','movimento'].map(k=>bloco(k,ESCALA)).join('')+

};

/* clique na planta (criar vaga) */
document.addEventListener('click',async ev=>{
  const w=ev.target.closest('#mapaed');if(!w||ev.target.closest('.vg'))return;
  const r=w.getBoundingClientRect();const x=+((ev.clientX-r.left)/r.width*100).toFixed(2),y=+((ev.clientY-r.top)/r.height*100).toFixed(2);
  S.mvw=+$('#mv-w').value||6;S.mvh=+$('#mv-h').value||6;
  const numero=(S.vagasEd.reduce((m,v)=>Math.max(m,v.numero),0))+1;
  const res=await sb.from('mapa_vagas').insert({mapa_id:S.mapaSel,numero,tamanho:$('#mv-tam').value,x,y,largura:S.mvw,altura:S.mvh}).select().single();
  if(res.error){toast(erroMsg(res.error));return}S.vagasEd.push(res.data);S.vagaSel=null;desenhaEditor();
});

document.addEventListener('input',ev=>{const t=ev.target;
  if(t.classList&&t.classList.contains('moeda')){const n=moedaNum(t.value);t.value=n==null?'':moedaTxt(n);return}
  if(t.dataset.mtn)S.montadores[+t.dataset.mtn].nome=t.value;
  if(t.dataset.mtc)S.montadores[+t.dataset.mtc].cpf=t.value;});
document.addEventListener('change',async ev=>{const t=ev.target;
  if(t.id==='mo-est'){$('#mo-placa-w').hidden=!t.checked;return}
  if(t.id==='sel-ed'||t.id==='lista-ed'){S.orgEdicao=t.value;render();return}
  if(t.id==='fb-ed'){S.fbEd=t.value;render();return}
  if(t.id==='mp-sel'){S.mapaSel=t.value;S.vagaSel=null;render();return}
  if(t.dataset.pago){const r=await sb.from('inscricoes').update({pago:t.checked}).eq('id',t.dataset.pago);toast(r.error?erroMsg(r.error):t.checked?'Pagamento registrado. O mapa foi liberado pro expositor.':'Pagamento desmarcado');if(!r.error)render();return}
  if(t.dataset.pst){await sb.from('propostas_espacos').update({status:t.value}).eq('id',t.dataset.pst);toast('Status atualizado');return}
  if(t.id==='m-file'){const files=[...t.files];if(!files.length)return;toast('Enviando fotos…');
    for(const f of files){if(f.size>5*1024*1024){toast(`${f.name} passa de 5 MB`);continue}
      const path=`${S.sessao.user.id}/${Date.now()}-${f.name.replace(/[^\w.]/g,'_')}`;const r=await sb.storage.from('fotos-marcas').upload(path,f);
      if(r.error){toast(erroMsg(r.error));continue}S.fotos.push(sb.storage.from('fotos-marcas').getPublicUrl(path).data.publicUrl)}
    t.value='';desenhaFotos();return}
  if(t.id==='comp-file'){const f=t.files[0];if(!f)return;if(f.size>10*1024*1024){toast('O arquivo passa de 10 MB');return}toast('Enviando comprovante…');
    const path=`${S.sessao.user.id}/${S.ins.id}-${Date.now()}-${f.name.replace(/[^\w.]/g,'_')}`;const r=await sb.storage.from('comprovantes').upload(path,f);
    if(r.error){toast(erroMsg(r.error));return}const r2=await sb.rpc('enviar_comprovante',{p_inscricao:S.ins.id,p_path:path});
    if(r2.error){toast(erroMsg(r2.error));return}toast('Comprovante enviado!');render();return}
  if(t.id==='mp-file'){const f=t.files[0];if(!f)return;toast('Enviando planta…');const path=`${S.mapaSel}/${Date.now()}-${f.name.replace(/[^\w.]/g,'_')}`;
    const r=await sb.storage.from('mapas').upload(path,f);if(r.error){toast(erroMsg(r.error));return}
    const url=sb.storage.from('mapas').getPublicUrl(path).data.publicUrl;const r2=await sb.from('mapas').update({imagem_url:url}).eq('id',S.mapaSel);if(r2.error){toast(erroMsg(r2.error));return}toast('Planta atualizada');render();return}
});
window.addEventListener('hashchange',()=>{if(location.hash==='#proposta')go('proposta')});
iniciar();
